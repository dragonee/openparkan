# What has been read in the game's code.
#
# An address on its own means nothing here: every module shares image base
# 0x10000000, so 0x1000129e is inside the .text of all fifteen of them.  This
# is the file that supplies the missing half, and `coverage.py --check` holds
# it to the binaries -- a `function` must start where it says, a `site` must
# be an instruction, a `datum` must not be code.
#
# `kind`:
#   function  a function entry point
#   site      one instruction inside a function, quoted for what it does there
#   datum     a table, vtable, string or counter -- anything not code
#
# Seeded from the tables in README.md, which are module-scoped.  The rest of
# the addresses the docs publish are named only in prose, and prose does not
# say which module reliably enough to import blind; they go in as their
# sections are re-read.

# --- the behaviour interpreter, ../docs/15-behaviour.md ---------------------
[[entry]]
module = "ai.dll"
at = "0x100014f9"
kind = "site"
name = "script gate: the first word, the function-table length, against 0x49; warns only"
read = true
doc = "analysis/README.md"


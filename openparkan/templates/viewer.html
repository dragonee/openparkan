<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #e8e9ea;
    --panel: #fbfbfc;
    --ink: #16181b;
    --muted: #656c74;
    --line: #cdd1d5;
    --line-soft: #e2e5e8;
    --signal: #b06a10;
    --signal-soft: #f0e2cd;
    --fog: 0xd8dade;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #111417;
      --panel: #191d21;
      --ink: #e6e9ec;
      --muted: #8d959e;
      --line: #2c3238;
      --line-soft: #23282d;
      --signal: #e0a24a;
      --signal-soft: #33291a;
      --fog: 0x12161a;
    }
  }
  :root[data-theme="dark"] {
    --ground: #111417;
    --panel: #191d21;
    --ink: #e6e9ec;
    --muted: #8d959e;
    --line: #2c3238;
    --line-soft: #23282d;
    --signal: #e0a24a;
    --signal-soft: #33291a;
    --fog: 0x12161a;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }

  .instrument {
    position: fixed; top: 16px; left: 16px; z-index: 5; width: 262px;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.07);
    display: flex; flex-direction: column;
  }
  .head { padding: 13px 15px 12px; border-bottom: 1px solid var(--line); }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px;
  }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.012em; }
  .path {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px; color: var(--muted); margin-top: 5px;
    word-break: break-all;
  }

  .body { padding: 13px 15px; display: flex; flex-direction: column; gap: 13px; }
  label {
    display: block; font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px;
  }
  select {
    font: inherit; font-size: 13px; width: 100%;
    color: var(--ink); background: var(--ground);
    border: 1px solid var(--line); border-radius: 2px; padding: 5px 7px;
  }
  select:focus-visible, button:focus-visible {
    outline: 2px solid var(--signal); outline-offset: 1px;
  }

  .readout { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; }
  .readout dt {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: .04em; color: var(--muted);
    text-transform: uppercase; align-self: baseline;
  }
  .readout dd {
    margin: 0; text-align: right;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .readout dd .unit { color: var(--muted); font-size: 10.5px; }

  .layers { display: flex; flex-wrap: wrap; gap: 4px; }
  .layer {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px; padding: 2px 6px;
    border: 1px solid var(--line); border-radius: 2px; color: var(--muted);
  }
  .layer.wet { border-color: var(--signal); color: var(--signal); background: var(--signal-soft); }
  .clan { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button {
    font: inherit; font-size: 12px; cursor: pointer;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 2px; padding: 5px 6px;
  }
  button:hover { color: var(--ink); border-color: var(--muted); }
  button[aria-pressed="true"] {
    color: var(--signal); border-color: var(--signal); background: var(--signal-soft);
  }

  .foot {
    padding: 9px 15px 11px; border-top: 1px solid var(--line-soft);
    color: var(--muted); font-size: 11px;
  }
  .foot kbd {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; border: 1px solid var(--line); border-radius: 2px;
    padding: 0 3px; color: var(--ink);
  }
  #err {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: 32px; text-align: center; color: var(--muted); max-width: 34em;
    margin: 0 auto;
  }
</style>

<div id="stage"></div>

<div class="instrument">
  <div class="head">
    <div class="eyebrow">Parkan &middot; Iron Strategy</div>
    <h1>Terrain survey</h1>
    <div class="path" id="path">DATA/MAPS/</div>
  </div>
  <div class="body">
    <div>
      <label for="scenesel">Scene</label>
      <select id="scenesel"></select>
    </div>
    <dl class="readout">
      <dt>Extent</dt><dd id="ext">&ndash;</dd>
      <dt>Elevation</dt><dd id="hgt">&ndash;</dd>
      <dt>Triangles</dt><dd id="nf">&ndash;</dd>
      <dt>Water</dt><dd id="wat">&ndash;</dd>
      <dt id="objdt" hidden>Placed</dt><dd id="obj" hidden>&ndash;</dd>
    </dl>
    <div id="clanbox" hidden>
      <label>Clans &middot; data.tma</label>
      <div class="layers" id="clans"></div>
    </div>
    <div>
      <label>Ground layer &middot; Land1.wea</label>
      <div class="layers" id="layers"></div>
    </div>
    <div class="controls">
      <button id="wire" aria-pressed="false">Wireframe</button>
      <button id="spin" aria-pressed="true">Orbit</button>
    </div>
  </div>
  <div class="foot">
    <kbd>drag</kbd> rotate &middot; <kbd>scroll</kbd> zoom &middot; <kbd>shift</kbd>+drag pan
  </div>
</div>

<div id="err" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = "__DATA__";
const UV_SCALE = 256;

function b64(s, Type) {
  const bin = atob(s);
  const buf = new ArrayBuffer(bin.length);
  const view = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
  return new Type(buf);
}

if (typeof THREE === "undefined") {
  const e = document.getElementById("err");
  e.hidden = false;
  e.textContent = "three.js did not load, so the terrain cannot be drawn. " +
    "Reload the page; if it keeps failing, a network policy is blocking cdnjs.cloudflare.com.";
} else {
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(46, 1, 1, 60000);
  const sun = new THREE.DirectionalLight(0xffffff, 0.92);
  sun.position.set(-0.5, 1.0, 0.6);
  scene.add(sun, new THREE.AmbientLight(0xffffff, 0.46));

  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function applyTheme() {
    const fog = parseInt(cssVar("--fog"), 16);
    scene.background = new THREE.Color(fog);
    scene.fog = new THREE.Fog(fog, 2600, 11000);
  }
  applyTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

  // Orbit camera, hand-rolled so the page needs exactly one CDN script.
  const cam = { yaw: -0.7, pitch: 0.6, dist: 3200, target: new THREE.Vector3(0, 0, 0) };
  let spinning = !reduceMotion;
  function place() {
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    camera.position.set(
      cam.target.x + cam.dist * cp * Math.sin(cam.yaw),
      cam.target.y + cam.dist * sp,
      cam.target.z + cam.dist * cp * Math.cos(cam.yaw)
    );
    camera.lookAt(cam.target);
  }
  let drag = null;
  const stopSpin = () => {
    spinning = false;
    document.getElementById("spin").setAttribute("aria-pressed", "false");
  };
  renderer.domElement.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 2 };
    renderer.domElement.setPointerCapture(e.pointerId);
    stopSpin();
  });
  renderer.domElement.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.pan) {
      const k = cam.dist * 0.0012;
      cam.target.x -= (dx * Math.cos(cam.yaw) - dy * Math.sin(cam.yaw)) * k;
      cam.target.z += (dx * Math.sin(cam.yaw) + dy * Math.cos(cam.yaw)) * k;
    } else {
      cam.yaw -= dx * 0.005;
      cam.pitch = Math.max(0.04, Math.min(1.5, cam.pitch + dy * 0.005));
    }
    place();
  });
  const endDrag = () => { drag = null; };
  renderer.domElement.addEventListener("pointerup", endDrag);
  renderer.domElement.addEventListener("pointercancel", endDrag);
  renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());
  renderer.domElement.addEventListener("wheel", (e) => {
    e.preventDefault();
    cam.dist = Math.max(120, Math.min(20000, cam.dist * (1 + Math.sign(e.deltaY) * 0.12)));
    place();
  }, { passive: false });

  const loader = new THREE.TextureLoader();
  const textureCache = {};
  let current = null;

  function show(map) {
    if (current) {
      scene.remove(current);
      current.geometry.dispose();
      current.material.forEach((m) => m.dispose());  // pooled textures outlive the mesh
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position",
      new THREE.BufferAttribute(b64(map.position, Int16Array), 3, true));
    g.setAttribute("normal", new THREE.BufferAttribute(b64(map.normal, Int16Array), 3, true));
    g.setAttribute("uv", new THREE.BufferAttribute(b64(map.uv, Uint16Array), 2));
    g.setIndex(new THREE.BufferAttribute(
      b64(map.index, map.wideIndex ? Uint32Array : Uint16Array), 1));
    map.groups.forEach((gr) => g.addGroup(gr.start, gr.count, gr.material));

    const mats = map.materials.map((m) => {
      const src = DATA.pool[m.pool];
      const opts = { side: THREE.DoubleSide };
      if (src.kind === "texture") {
        const t = textureCache[m.pool] || (textureCache[m.pool] = loader.load(src.url));
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        // UVs arrive as raw 8.8 fixed point; undo the scale here.
        t.repeat.set(1 / UV_SCALE, 1 / UV_SCALE);
        opts.map = t;
      } else {
        opts.color = src.colour;
      }
      if (m.water || src.opacity < 1) { opts.transparent = true; opts.opacity = src.opacity; }
      return new THREE.MeshLambertMaterial(opts);
    });
    current = new THREE.Mesh(g, mats);
    // Dequantise on the object, never on the geometry.
    current.scale.set(map.scale[0], map.scale[1], map.scale[2]);
    current.position.set(map.offset[0], map.offset[1], map.offset[2]);
    scene.add(current);

    cam.target.set(0, (map.height[0] + map.height[1]) / 2, 0);
    cam.dist = Math.max(map.extent[0], map.extent[1]) * 1.3;
    place();

    const num = (v) => v.toLocaleString();
    document.getElementById("nf").textContent = num(map.faceCount);
    document.getElementById("ext").innerHTML =
      num(Math.round(map.extent[0])) + " &times; " + num(Math.round(map.extent[1])) +
      ' <span class="unit">u</span>';
    document.getElementById("hgt").innerHTML =
      map.height[0] + " to " + map.height[1] + ' <span class="unit">u</span>';
    document.getElementById("wat").innerHTML = map.water
      ? 'z=' + map.water.z + ' <span class="unit">u, ' + map.water.faces + ' faces</span>'
      : '<span class="unit">none</span>';
    document.getElementById("layers").innerHTML = map.layer1
      .map((n, i) => '<span class="layer' + (map.wetLayers.includes(i) ? " wet" : "") + '">' +
        n + "</span>").join("");
  }

  // --- mission object markers ---------------------------------------------
  // Each kind gets a silhouette you can tell apart at a distance: an upright
  // block for a building, a nose-up cone for a unit, a small ball for scenery.
  const SHAPES = {
    0: new THREE.BoxGeometry(15, 15, 15),
    1: new THREE.ConeGeometry(7, 20, 5),
    2: new THREE.SphereGeometry(5, 6, 5),
    3: new THREE.SphereGeometry(5, 6, 5),
  };
  const NEUTRAL = 0x8a8a85;
  const SCENERY = 0x6f7360;
  const modelCache = {};
  const modelMatCache = {};
  let overlay = null;

  // Objects are drawn from their real geometry, decoded through objects.rlb.
  // Geometries are shared between every placement of a model, and shading is
  // flat, so the meshes ship without per-vertex normals.
  function modelGeometry(i) {
    if (modelCache[i]) return modelCache[i];
    const src = DATA.models[i];
    const g = new THREE.BufferGeometry();
    // Positions arrive quantised to int16 over the model's bounding box; the
    // normalized flag maps them back to -1..1 in the shader. The scale and
    // offset that restore world units are applied to the *object*, never to
    // the geometry: BufferGeometry.scale() reads raw integers out of a
    // normalized attribute and writes them back, which overflows the buffer.
    g.setAttribute("position",
      new THREE.BufferAttribute(b64(src.position, Int16Array), 3, true));
    g.setAttribute("uv", new THREE.BufferAttribute(b64(src.uv, Uint16Array), 2));
    g.setIndex(new THREE.BufferAttribute(
      b64(src.index, src.wide ? Uint32Array : Uint16Array), 1));
    src.groups.forEach((gr, k) => g.addGroup(gr.start, gr.count, k));
    g.computeVertexNormals();
    modelCache[i] = g;
    return g;
  }

  // One material per draw batch, textured through
  // batch -> wear -> Material.lib -> Textures.lib.
  function modelMaterials(i, tint) {
    const key = i + "|" + tint;
    if (modelMatCache[key]) return modelMatCache[key];
    const src = DATA.models[i];
    const mats = src.groups.map((gr) => {
      const opts = { side: THREE.DoubleSide, color: tint };
      const pooled = gr.material >= 0 ? DATA.pool[gr.material] : null;
      if (pooled && pooled.kind === "texture") {
        const t = textureCache[gr.material] ||
          (textureCache[gr.material] = loader.load(pooled.url));
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(1 / UV_SCALE, 1 / UV_SCALE);
        opts.map = t;
      } else if (pooled) {
        opts.color = pooled.colour;
      }
      return new THREE.MeshLambertMaterial(opts);
    });
    modelMatCache[key] = mats;
    return mats;
  }

  // A model sits inside a group so its own scale and offset compose with the
  // placement's rotation in the right order.
  function modelInstance(i, tint) {
    const src = DATA.models[i];
    const inner = new THREE.Mesh(modelGeometry(i), modelMaterials(i, tint));
    inner.scale.set(src.scale[0], src.scale[1], src.scale[2]);
    inner.position.set(src.offset[0], src.offset[1], src.offset[2]);
    const group = new THREE.Group();
    group.add(inner);
    return group;
  }

  function clearOverlay() {
    if (!overlay) return;
    scene.remove(overlay);
    overlay.traverse((n) => {
      // Marker shapes and model geometries are shared and outlive the overlay;
      // only line geometry is built per mission.
      if (n.isLine && n.geometry.dispose) n.geometry.dispose();
      if ((n.isMesh || n.isLine) && n.material.dispose) n.material.dispose();
    });
    overlay = null;
  }

  function showMission(mis) {
    clearOverlay();
    const map = DATA.maps[mis.map];
    const cx = map.centre[0], cy = map.centre[1];
    overlay = new THREE.Group();

    const flat = (colour) => new THREE.MeshLambertMaterial({
      color: colour, side: THREE.DoubleSide, flatShading: true,
    });
    const mats = mis.clans.map((c) => new THREE.MeshLambertMaterial({ color: c.colour }));
    const meshMats = mis.clans.map((c) => flat(c.colour));
    const neutral = new THREE.MeshLambertMaterial({ color: NEUTRAL });

    const sceneryMat = flat(SCENERY);
    let drawn = 0;
    const tintOf = (c) => {
      const r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
      const mix = (v) => Math.round(255 - (255 - v) * 0.35);
      return (mix(r) << 16) | (mix(g) << 8) | mix(b);
    };
    mis.objects.forEach((o) => {
      // o.p is [x, z, y] in game space; the map is recentred and Y-up.
      let m;
      if (o.m !== undefined) {
        // Clan-owned things take their clan's colour; scenery stays neutral.
        // Owned objects take a light wash of their clan colour over the
        // texture; scenery stays untinted.
        m = modelInstance(o.m, o.c < 0 ? 0xffffff : tintOf(mis.clans[o.c].colour));
        m.position.set(o.p[0] - cx, o.p[1], -(o.p[2] - cy));
        // Game rotation is about the up axis; the Y flip reverses its sense.
        m.rotation.y = -o.r;
        drawn++;
      } else {
        m = new THREE.Mesh(SHAPES[o.k] || SHAPES[2], o.c < 0 ? neutral : mats[o.c]);
        m.position.set(o.p[0] - cx, o.p[1] + 8, -(o.p[2] - cy));
      }
      overlay.add(m);
    });

    // Campaign missions carry waypoint routes; draw them as polylines.
    mis.routes.forEach((route) => {
      const pts = route.map((p) => new THREE.Vector3(p[0] - cx, p[2] + 6, -(p[1] - cy)));
      const g = new THREE.BufferGeometry().setFromPoints(pts);
      overlay.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xd0a050 })));
    });

    scene.add(overlay);

    document.getElementById("objdt").hidden = false;
    document.getElementById("obj").hidden = false;
    document.getElementById("obj").innerHTML = mis.objects.length.toLocaleString() +
      (drawn ? ' <span class="unit">(' + drawn + " meshed)</span>" : "");
    document.getElementById("clanbox").hidden = false;
    document.getElementById("clans").innerHTML = mis.clans.map((c) =>
      '<span class="layer clan"><span class="dot" style="background:#' +
      c.colour.toString(16).padStart(6, "0") + '"></span>' + c.name + "</span>").join("");
  }

  function showTerrainOnly() {
    clearOverlay();
    document.getElementById("objdt").hidden = true;
    document.getElementById("obj").hidden = true;
    document.getElementById("clanbox").hidden = true;
  }

  // --- scene selector -----------------------------------------------------
  const sel = document.getElementById("scenesel");
  const scenes = [];
  function addGroup(name, entries) {
    if (!entries.length) return;
    const g = document.createElement("optgroup");
    g.label = name;
    entries.forEach(({ text, fn }) => {
      const o = document.createElement("option");
      o.value = String(scenes.length);
      o.textContent = text;
      scenes.push(fn);
      g.appendChild(o);
    });
    sel.appendChild(g);
  }
  addGroup("Missions", DATA.missions.map((mis) => ({
    text: mis.label + " -- " + mis.title,
    fn: () => {
      show(DATA.maps[mis.map]);
      showMission(mis);
      document.getElementById("path").textContent =
        "MISSIONS/" + mis.label.replace(" / ", "/") + "/data.tma";
    },
  })));
  addGroup("Terrain only", DATA.maps.map((m, i) => ({
    text: m.name,
    fn: () => {
      show(DATA.maps[i]);
      showTerrainOnly();
      document.getElementById("path").textContent = "DATA/MAPS/" + m.name + "/Land.msh";
    },
  })));
  sel.addEventListener("change", () => scenes[+sel.value]());

  document.getElementById("wire").addEventListener("click", (e) => {
    const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", String(on));
    current.material.forEach((m) => { m.wireframe = on; });
  });
  document.getElementById("spin").addEventListener("click", (e) => {
    spinning = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", String(spinning));
  });
  if (reduceMotion) document.getElementById("spin").setAttribute("aria-pressed", "false");

  function resize() {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  resize();
  scenes[0]();

  (function loop() {
    requestAnimationFrame(loop);
    if (spinning) { cam.yaw += 0.0015; place(); }
    renderer.render(scene, camera);
  })();
}
</script>

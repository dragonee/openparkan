<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #e8e9ea;
    --panel: #fbfbfc;
    --ink: #16181b;
    --muted: #656c74;
    --line: #cdd1d5;
    --line-soft: #e2e5e8;
    --signal: #b06a10;
    --signal-soft: #f0e2cd;
    --fog: 0xd8dade;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #111417;
      --panel: #191d21;
      --ink: #e6e9ec;
      --muted: #8d959e;
      --line: #2c3238;
      --line-soft: #23282d;
      --signal: #e0a24a;
      --signal-soft: #33291a;
      --fog: 0x12161a;
    }
  }
  :root[data-theme="dark"] {
    --ground: #111417;
    --panel: #191d21;
    --ink: #e6e9ec;
    --muted: #8d959e;
    --line: #2c3238;
    --line-soft: #23282d;
    --signal: #e0a24a;
    --signal-soft: #33291a;
    --fog: 0x12161a;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }

  .instrument {
    position: fixed; top: 16px; left: 16px; z-index: 5; width: 262px;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.07);
    display: flex; flex-direction: column;
  }
  .head { padding: 13px 15px 12px; border-bottom: 1px solid var(--line); }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px;
  }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.012em; }
  .path {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px; color: var(--muted); margin-top: 5px;
    word-break: break-all;
  }

  .body { padding: 13px 15px; display: flex; flex-direction: column; gap: 13px; }
  label {
    display: block; font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px;
  }
  select {
    font: inherit; font-size: 13px; width: 100%;
    color: var(--ink); background: var(--ground);
    border: 1px solid var(--line); border-radius: 2px; padding: 5px 7px;
  }
  select:focus-visible, button:focus-visible {
    outline: 2px solid var(--signal); outline-offset: 1px;
  }

  .readout { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; }
  .readout dt {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: .04em; color: var(--muted);
    text-transform: uppercase; align-self: baseline;
  }
  .readout dd {
    margin: 0; text-align: right;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .readout dd .unit { color: var(--muted); font-size: 10.5px; }

  .layers { display: flex; flex-wrap: wrap; gap: 4px; }
  .layer {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px; padding: 2px 6px;
    border: 1px solid var(--line); border-radius: 2px; color: var(--muted);
  }
  .layer.wet { border-color: var(--signal); color: var(--signal); background: var(--signal-soft); }
  .clan { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  #timebox input { width: 100%; accent-color: var(--signal); margin: 0; }
  #timebox label { display: flex; justify-content: space-between; gap: 8px; }
  #timeval { color: var(--ink); letter-spacing: 0; text-transform: none; font-size: 11px; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button {
    font: inherit; font-size: 12px; cursor: pointer;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 2px; padding: 5px 6px;
  }
  button:hover { color: var(--ink); border-color: var(--muted); }
  button[aria-pressed="true"] {
    color: var(--signal); border-color: var(--signal); background: var(--signal-soft);
  }

  .foot {
    padding: 9px 15px 11px; border-top: 1px solid var(--line-soft);
    color: var(--muted); font-size: 11px;
  }
  .foot kbd {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; border: 1px solid var(--line); border-radius: 2px;
    padding: 0 3px; color: var(--ink);
  }
  #err {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: 32px; text-align: center; color: var(--muted); max-width: 34em;
    margin: 0 auto;
  }
</style>

<div id="stage"></div>

<div class="instrument">
  <div class="head">

    <div class="path" id="path">DATA/MAPS/</div>

  <div class="body">

<div id="err" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script>
const DATA = "__DATA__";
const UV_SCALE = 256;
// Lightmap UVs are the same uint16 over 1024, not 256: one atlas page.
const LIGHTMAP_UV_SCALE = 1024;
// The scene already has a sun and an ambient term, so the baked map is
// dialled back rather than added at full strength.
const LIGHTMAP_INTENSITY = 1;

// Geometry buffers are deflated before they are base64'd, which halves the
// page: quantised positions and indices compress well and base64 otherwise
// costs a third on top.
function b64(s, Type) {
  const bin = atob(s);
  const view = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
  return new Type(pako.inflate(view).buffer);
}

if (typeof THREE === "undefined" || typeof pako === "undefined") {
  const e = document.getElementById("err");
  e.hidden = false;
  e.textContent = "three.js or pako did not load, so the terrain cannot be drawn. " +
    "Reload the page; if it keeps failing, a network policy is blocking cdnjs.cloudflare.com.";
} else {
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = document.getElementById("stage");
  // Logarithmic depth: the scene runs from a 1.5-unit chassis to a 26000-unit
  // sky dome, and a linear buffer over that range resolves about half a unit
  // at 3 km -- enough to make a bunker's base and the ground it rests on swap
  // places as the camera orbits.
  const renderer = new THREE.WebGLRenderer({
    antialias: true, logarithmicDepthBuffer: true,
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(46, 1, 1, 60000);
  const sun = new THREE.DirectionalLight(0xffffff, 0.92);
  sun.position.set(-0.5, 1.0, 0.6);
  scene.add(sun, new THREE.AmbientLight(0xffffff, 0.46));

  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let missionSky = null;

  // The sky, from the mission's own atmosphere file.  Four pieces:
  //   * a dome carrying the nebula, tinted by the keyframe's zenith and
  //     horizon colours -- MeshBasicMaterial multiplies map by vertex colour,
  //     so one draw gives "the nebula under this hour's light";
  //   * the stars over it, additive, fading in as the day's light drops;
  //   * the clouds over that, tiled and tinted by the horizon;
  //   * the sun and the moon as billboards.
  // sky.wea's nine slots are fixed roles, and the material behind each names
  // both a texture and a cell of it -- see docs/10-sky.md.
  const DOME_RADIUS = 26000;
  const CLOUD_TILES = 4;
  // The sky rides with the camera, so the horizon stays at eye level however
  // far the view climbs.
  // The order the see-through layers composite in, back to front.  three.js
  // draws every opaque item first and then the transparent ones sorted by
  // renderOrder, so this is the whole of the scene's alpha ordering; the lens
  // flare is not in it because it is a separate overlay scene drawn after.
  //
  // Water is the one transparent surface in the world rather than on the sky,
  // and it does not need sorting against itself: all 11 maps that carry water
  // carry it as a single flat plane, none at two heights, so no water surface
  // is ever behind another.  It still must not write depth, or it would cull
  // whatever is drawn later underneath it.
  const LAYER = {
    dome: -3,       // the nebula, on the inside of the sky sphere
    stars: -2,      // additive, over the dome
    clouds: -1,     // over the stars
    // opaque terrain, buildings and units draw here, at 0
    water: 1,       // after the lake bed it is seen through
    rain: 2,        // falls in front of the world
    footprint: 3,   // an overlay on the ground, depth-test off
  };
  const skyGroup = new THREE.Group();
  scene.add(skyGroup);
  let dome = null, starLayer = null, cloudLayer = null, sunSprite = null, moonSprite = null;
  //: Whichever of the sun and moon is up, and the strength its own elevation
  //: gives the flare.  The overlay needs both every frame.
  let sunHeading = null;
  let flareGate = 0;

  function domeGeometry() {
    return new THREE.SphereGeometry(DOME_RADIUS, 40, 28);
  }

  function tintDome(g, zenith, horizon) {
    const top = new THREE.Color(zenith), low = new THREE.Color(horizon);
    const pos = g.attributes.position, colour = [];
    for (let i = 0; i < pos.count; i++) {
      // 0 at the horizon, 1 overhead; squared so the band sits low, which is
      // where a real sky's gradient lives.
      const t = Math.max(0, pos.getY(i) / DOME_RADIUS);
      colour.push(...low.clone().lerp(top, t * t).toArray());
    }
    g.setAttribute("color", new THREE.Float32BufferAttribute(colour, 3));
    g.attributes.color.needsUpdate = true;
  }

  function skyTexture(pool, repeat) {
    const t = textureCache["sky" + pool] ||
      (textureCache["sky" + pool] = loader.load(DATA.pool[pool].url));
    if (repeat) {
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(repeat, repeat);
    }
    return t;
  }

  function dropSky() {
    buildFlare(null);
    buildRain(null);
    sunHeading = null;
    flareGate = 0;
    rainWanted = 0;
    [dome, starLayer, cloudLayer, sunSprite, moonSprite].forEach((o) => {
      if (!o) return;
      skyGroup.remove(o);
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
    dome = starLayer = cloudLayer = sunSprite = moonSprite = null;
  }

  function buildSky(sky) {
    dropSky();
    if (!sky) return;
    const opts = { side: THREE.BackSide, fog: false, depthWrite: false, vertexColors: true };
    if (sky.nebula !== undefined) opts.map = skyTexture(sky.nebula);
    dome = new THREE.Mesh(domeGeometry(), new THREE.MeshBasicMaterial(opts));
    dome.renderOrder = LAYER.dome;
    skyGroup.add(dome);

    if (sky.stars !== undefined) {
      starLayer = new THREE.Mesh(domeGeometry(), new THREE.MeshBasicMaterial({
        map: skyTexture(sky.stars), side: THREE.BackSide, fog: false,
        depthWrite: false, transparent: true, blending: THREE.AdditiveBlending,
      }));
      starLayer.renderOrder = LAYER.stars;
      starLayer.scale.setScalar(0.99);
      skyGroup.add(starLayer);
    }
    if (sky.clouds !== undefined) {
      cloudLayer = new THREE.Mesh(domeGeometry(), new THREE.MeshBasicMaterial({
        map: skyTexture(sky.clouds, CLOUD_TILES), side: THREE.BackSide, fog: false,
        depthWrite: false, transparent: true, opacity: 0.7,
      }));
      cloudLayer.renderOrder = LAYER.clouds;
      cloudLayer.scale.setScalar(0.97);
      skyGroup.add(cloudLayer);
    }
    const place = (pool, size) => {
      if (pool === undefined) return null;
      const m = new THREE.Sprite(new THREE.SpriteMaterial({
        map: skyTexture(pool), fog: false, depthWrite: false, transparent: true,
        blending: THREE.AdditiveBlending,
      }));
      m.scale.setScalar(size);
      skyGroup.add(m);
      return m;
    };
    sunSprite = place(sky.sun, DOME_RADIUS * 0.17);
    moonSprite = place(sky.moon, DOME_RADIUS * 0.12);
    buildFlare(sky);
    buildRain(sky);
  }

  // Rain.  A keyframe that names atm_rain1.wav starts it, and one that names
  // env_lightning starts lightning; eight of the 29 missions carry each, and
  // none names snow.  Where the weather stops is not written down -- the sun
  // and moon come in start/stop pairs, these appear once -- so the payload
  // runs it to the next keyframe that names anything, which on Single.01 is a
  // wet morning from 07:00 to 15:00.  The drops are the mission's own
  // RAIN_DROP: cell 21 of EFFECT6.0, a 16 x 16 icon its Page table points at.
  const RAIN_BOX = 900;
  const RAIN_DROPS = 1400;
  const RAIN_FALL = 900;      // units a second
  let rainLayer = null, rainVelocity = null, rainWanted = 0;

  function buildRain(sky) {
    if (rainLayer) {
      skyGroup.remove(rainLayer);
      rainLayer.geometry.dispose();
      rainLayer.material.dispose();
      rainLayer = null;
    }
    if (!sky || sky.rain === undefined) return;
    const xyz = new Float32Array(RAIN_DROPS * 3);
    rainVelocity = new Float32Array(RAIN_DROPS);
    for (let i = 0; i < RAIN_DROPS; i++) {
      xyz[i * 3] = (Math.random() - 0.5) * RAIN_BOX;
      xyz[i * 3 + 1] = (Math.random() - 0.5) * RAIN_BOX;
      xyz[i * 3 + 2] = (Math.random() - 0.5) * RAIN_BOX;
      rainVelocity[i] = RAIN_FALL * (0.75 + Math.random() * 0.5);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(xyz, 3));
    rainLayer = new THREE.Points(g, new THREE.PointsMaterial({
      map: skyTexture(sky.rain), size: 9, sizeAttenuation: true,
      transparent: true, opacity: 0, depthWrite: false, fog: false,
    }));
    rainLayer.renderOrder = LAYER.rain;
    skyGroup.add(rainLayer);
  }

  function fallRain(dt) {
    if (!rainLayer) return;
    const m = rainLayer.material;
    // Ease, so the shower arrives rather than snapping on with the slider.
    m.opacity += (rainWanted - m.opacity) * Math.min(1, dt * 3);
    rainLayer.visible = m.opacity > 0.005;
    if (!rainLayer.visible) return;
    const p = rainLayer.geometry.attributes.position;
    const floor = -RAIN_BOX / 2;
    for (let i = 0; i < RAIN_DROPS; i++) {
      let y = p.array[i * 3 + 1] - rainVelocity[i] * dt;
      if (y < floor) {
        y += RAIN_BOX;
        p.array[i * 3] = (Math.random() - 0.5) * RAIN_BOX;
        p.array[i * 3 + 2] = (Math.random() - 0.5) * RAIN_BOX;
      }
      p.array[i * 3 + 1] = y;
    }
    p.needsUpdate = true;
  }

  // The lens flare.  Terrain.dll's CSun::RenderFlare strings twelve sprites
  // along the line from the sun's position on screen through the centre of
  // the screen; the payload carries its table of positions, sizes and colours
  // straight out of the engine.  It is drawn as a 2D overlay after the scene,
  // which is what the engine does too -- the flare is in the lens, not the
  // world, so it takes no depth test.
  const flareScene = new THREE.Scene();
  const flareCamera = new THREE.OrthographicCamera(0, 1, 1, 0, -1, 1);
  let flareGhosts = [];
  let sunScreen = new THREE.Vector3();

  function buildFlare(sky) {
    flareGhosts.forEach((g) => {
      flareScene.remove(g);
      g.material.dispose();
    });
    flareGhosts = [];
    const chain = sky && sky.flareChain;
    if (!chain || sky.flare === undefined) return;
    chain.forEach((e) => {
      const pool = e.tex && sky.flare2 !== undefined ? sky.flare2 : sky.flare;
      const g = new THREE.Sprite(new THREE.SpriteMaterial({
        map: skyTexture(pool), color: new THREE.Color(e.colour),
        transparent: true, depthTest: false, depthWrite: false, fog: false,
        blending: THREE.AdditiveBlending, opacity: 0,
      }));
      g.userData = e;
      flareScene.add(g);
      flareGhosts.push(g);
    });
  }

  // The engine gates the flare twice.
  //
  // The first is a 15-degree cone about the view axis: linear in the cosine,
  // then squared.  That angle is calibrated to the game's own field of view,
  // and against this survey's wide orbiting camera -- which looks down at the
  // terrain from above -- it would almost never open, so the same
  // linear-then-squared ramp is driven by how far the sun sits from the centre
  // of the screen instead.  Same idea, window the size of the viewport.
  //
  // The second is the engine's own, now that it is known what it measures:
  // the height of the body's direction, ramped between the cosines of 60 and
  // 30 degrees.  The sun's fixed elevation is exactly 60 degrees, so it sits
  // on the top edge of that ramp and always flares at full; the moon's 40
  // puts it at 0.39.
  function heightGate(y) {
    if (!missionSky || !missionSky.flareHeight) return 0;
    const [zero, full] = missionSky.flareHeight;
    if (y >= full) return 1;
    if (y <= zero) return 0;
    return (y - zero) / (full - zero);
  }

  function drawFlare(dir, gate) {
    if (!flareGhosts.length) return false;
    let intensity = gate;
    sunScreen.copy(dir).multiplyScalar(DOME_RADIUS).add(camera.position)
      .project(camera);
    const cx = innerWidth / 2, cy = innerHeight / 2;
    const sx = (sunScreen.x * 0.5 + 0.5) * innerWidth;
    const sy = (sunScreen.y * 0.5 + 0.5) * innerHeight;
    // Behind the camera the projection wraps round; there is no flare then.
    if (sunScreen.z > 1) intensity = 0;
    const near = Math.max(0, 1 - Math.hypot(sx - cx, sy - cy) / Math.hypot(cx, cy));
    intensity *= near * near;
    if (intensity <= 0.001) {
      flareGhosts.forEach((g) => { g.material.opacity = 0; });
      return false;
    }
    flareGhosts.forEach((g) => {
      const e = g.userData;
      const half = 0.25 * cx * e.size;
      g.position.set(cx + (sx - cx) * e.at, cy + (sy - cy) * e.at, 0);
      g.scale.set(half * 2, half * 2, 1);
      g.material.opacity = e.alpha * intensity;
    });
    return true;
  }

  // Where the sun stands -- and it does not move.  CSun::Render rebuilds its
  // matrix every frame from two angles the constructor sets once, and those
  // two are constants in Terrain.dll rather than anything out of sky.ske: an
  // azimuth and a tilt from the zenith, picked by whether the keyframe's name
  // is exactly "sun".  The sun ends up 60 degrees above the horizon and the
  // moon 40, a quarter turn apart, and each stays there for the mission.
  // See docs/10-sky.md.
  function bodyDirection(name) {
    const b = missionSky && missionSky.bodies && missionSky.bodies[name];
    if (!b) return new THREE.Vector3(0.5, 0.866, 0);
    return new THREE.Vector3().fromArray(b.dir);
  }

  // The keyframe currently shown, and the colours it puts on everything.
  function applyKeyframe(frame) {
    if (!missionSky || !frame) return;
    scene.background = new THREE.Color(frame.h);
    scene.fog = new THREE.Fog(frame.h, 3200, 15000);
    sun.color = new THREE.Color(frame.s);
    sun.intensity = Math.min(1.15, 0.55 + 0.22 * frame.l);
    if (dome) tintDome(dome.geometry, frame.z, frame.h);
    if (starLayer) starLayer.material.opacity = frame.n;
    if (cloudLayer) cloudLayer.material.color = new THREE.Color(frame.h);

    rainWanted = frame.w === "rain" ? 0.85 : 0;

    // Which body is up.  Both the sun and the moon come in start/stop pairs
    // and no mission has them up at once -- the sun runs about 01:30 to 15:00
    // and the moon 16:20 to midnight -- so at most one of these is drawn, each
    // at its own fixed place.
    const lit = frame.u || [];
    const sunUp = lit.indexOf("sun") >= 0;
    const moonUp = lit.indexOf("moon") >= 0;
    const dir = bodyDirection(sunUp || !moonUp ? "sun" : "moon");
    sunHeading = sunUp || moonUp ? dir : null;
    sun.position.copy(dir).normalize();
    if (sunSprite) {
      sunSprite.position.copy(dir).multiplyScalar(DOME_RADIUS * 0.92);
      sunSprite.material.opacity = sunUp ? 1 : 0;
    }
    if (moonSprite) {
      moonSprite.position.copy(bodyDirection("moon"))
        .multiplyScalar(DOME_RADIUS * 0.92);
      moonSprite.material.opacity = moonUp ? 1 : 0;
    }
    // The engine's own second gate, on the height of whichever body is up.
    flareGate = sunUp || moonUp ? heightGate(dir.y) : 0;
    const label = document.getElementById("timeval");
    if (label) label.textContent = frame.t;
  }

  function applyTheme() {
    if (missionSky) {
      buildSky(missionSky);
      const day = missionSky.day || [];
      const slider = document.getElementById("time");
      if (slider) {
        slider.max = String(Math.max(0, day.length - 1));
        slider.value = String(missionSky.peak || 0);
      }
      applyKeyframe(day[missionSky.peak || 0] || {
        z: missionSky.zenith, h: missionSky.horizon, s: missionSky.sunColour,
        l: missionSky.light, n: 0, t: missionSky.time,
      });
      return;
    }
    dropSky();
    const fog = parseInt(cssVar("--fog"), 16);
    scene.background = new THREE.Color(fog);
    scene.fog = new THREE.Fog(fog, 2600, 11000);
    sun.color = new THREE.Color(0xffffff);
    sun.intensity = 0.92;
  }
  applyTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

  // Orbit camera, hand-rolled so the page needs exactly one CDN script.
  //: Building ground plans, hidden until the Footprints toggle asks for them.
  let footprints = [];

  const cam = { yaw: -0.7, pitch: 0.6, dist: 3200, target: new THREE.Vector3(0, 0, 0) };
  let spinning = !reduceMotion;
  function place() {
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    camera.position.set(
      cam.target.x + cam.dist * cp * Math.sin(cam.yaw),
      cam.target.y + cam.dist * sp,
      cam.target.z + cam.dist * cp * Math.cos(cam.yaw)
    );
    camera.lookAt(cam.target);
  }
  let drag = null;
  const stopSpin = () => {
    spinning = false;
    document.getElementById("spin").setAttribute("aria-pressed", "false");
  };
  renderer.domElement.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 2 };
    renderer.domElement.setPointerCapture(e.pointerId);
    stopSpin();
  });
  renderer.domElement.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.pan) {
      const k = cam.dist * 0.0012;
      cam.target.x -= (dx * Math.cos(cam.yaw) - dy * Math.sin(cam.yaw)) * k;
      cam.target.z += (dx * Math.sin(cam.yaw) + dy * Math.cos(cam.yaw)) * k;
    } else {
      cam.yaw -= dx * 0.005;
      cam.pitch = Math.max(0.04, Math.min(1.5, cam.pitch + dy * 0.005));
    }
    place();
  });
  const endDrag = () => { drag = null; };
  renderer.domElement.addEventListener("pointerup", endDrag);
  renderer.domElement.addEventListener("pointercancel", endDrag);
  renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());
  renderer.domElement.addEventListener("wheel", (e) => {
    e.preventDefault();
    cam.dist = Math.max(120, Math.min(20000, cam.dist * (1 + Math.sign(e.deltaY) * 0.12)));
    place();
  }, { passive: false });

  // A texture with alpha is drawn as a cutout: the alpha test discards the
  // hole rather than blending it, so nothing needs depth sorting.  Foliage is
  // crossed planes and only reads as a plant this way.
  // Register a texture slot for frame swapping if its payload names frames.
  // `apply` puts the texture where it belongs -- material.map for an ordinary
  // material, a uniform for the terrain's second ground layer.
  function animate(material, entry, frames, apply) {
    const list = frames || (entry && entry.frames);
    if (!list || list.length < 2) return material;
    animated.push({
      frames: list.map(groundTexture),
      apply: apply || ((t) => { material.map = t; }),
    });
    return material;
  }

  // A material's diffuse colour multiplies its texture.  It is where a
  // Parkan lake gets its blue: WATER's texture is a neutral grey ripple.
  const WHITE = 0xffffff;
  // Water is drawn see-through.  The material itself says opaque, but every
  // map with water also carries a WATER_BOT material on the ground under it,
  // and a lake bed nobody can see would not be worth authoring.  The exact
  // figure is a renderer choice.
  const WATER_OPACITY = 0.72;

  function multiply(a, b) {
    if (a === undefined) a = WHITE;
    if (b === undefined) b = WHITE;
    if (a === WHITE) return b;
    if (b === WHITE) return a;
    let out = 0;
    for (let shift = 16; shift >= 0; shift -= 8) {
      const v = (((a >> shift) & 255) * ((b >> shift) & 255)) / 255;
      out |= Math.round(v) << shift;
    }
    return out;
  }

  function applyCutout(opts, src) {
    if (!src.cutout) return opts;
    opts.alphaTest = src.graded ? 0.35 : 0.5;
    opts.transparent = false;
    return opts;
  }

  const loader = new THREE.TextureLoader();
  const textureCache = {};
  // Materials whose Material.lib record holds several frames -- water is ten,
  // lava eight.  Swapped in the render loop; three.js reads material.map into
  // the uniforms every frame, so no shader recompile is involved.
  const ANIM_FPS = 8;
  const animated = [];
  let current = null;

  // Terrain texture, shared by both layers.  UVs arrive as raw 8.8 fixed
  // point, so the scale is undone on the texture rather than the attribute.
  function groundTexture(pool) {
    const t = textureCache[pool] || (textureCache[pool] = loader.load(DATA.pool[pool].url));
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    t.repeat.set(1 / UV_SCALE, 1 / UV_SCALE);
    return t;
  }

  // Both ground layers in one material.  The terrain carries a second UV set
  // and a per-vertex weight for layer 1, so the mix happens in the fragment
  // shader rather than in a second, coplanar pass -- which is what used to
  // make the walkable ground flicker.
  // Material.lib's flags byte, from the archive directory.
  const BLEND_ALPHA = 4, BLEND_ADD = 8;

  const terrainShaders = [];
  let layer2On = true;

  function groundMaterial(m) {
    const src = DATA.pool[m.pool];
    const opts = { side: THREE.FrontSide };
    if (src.kind === "texture") opts.map = groundTexture(m.pool);
    opts.color = multiply(m.tint, src.kind === "texture" ? WHITE : src.colour);
    if (m.water || src.opacity < 1) {
      opts.transparent = true;
      opts.opacity = m.water ? WATER_OPACITY : src.opacity;
      // See LAYER: one plane per map, so it never sorts against itself, and
      // writing depth would only cull what is drawn later beneath it.
      opts.depthWrite = false;
    }
    applyCutout(opts, src);
    const material = new THREE.MeshLambertMaterial(opts);
    const second = m.pool2 === undefined ? null : DATA.pool[m.pool2];
    if (!second || second.kind !== "texture") return animate(material, m);

    material.onBeforeCompile = (shader) => {
      shader.uniforms.layer2 = { value: groundTexture(m.pool2) };
      shader.uniforms.layer2Tint = { value: new THREE.Color(multiply(m.tint2, WHITE)) };
      shader.uniforms.layer2Mix = { value: layer2On ? 1 : 0 };
      shader.vertexShader =
        "attribute vec2 uvLayer2;\nattribute float blend;\n" +
        "varying vec2 vUvLayer2;\nvarying float vBlend;\n" +
        shader.vertexShader.replace("#include <begin_vertex>",
          "#include <begin_vertex>\n  vUvLayer2 = uvLayer2 / " + UV_SCALE.toFixed(1) +
          ";\n  vBlend = blend;");
      shader.fragmentShader =
        "uniform sampler2D layer2;\nuniform vec3 layer2Tint;\nuniform float layer2Mix;\n" +
        "varying vec2 vUvLayer2;\nvarying float vBlend;\n" +
        shader.fragmentShader.replace("#include <map_fragment>",
          "#include <map_fragment>\n" +
          "  vec4 under = texture2D(layer2, vUvLayer2);\n" +
          "  under.rgb *= layer2Tint;\n" +
          "  diffuseColor = mix(diffuseColor, mix(under, diffuseColor, vBlend), layer2Mix);");
      terrainShaders.push(shader);
      // The second layer animates too -- WATER_M is a layer-2 material on
      // several maps -- so its frames swap the uniform rather than a map.
      animate(material, null, m.frames2, (t) => { shader.uniforms.layer2.value = t; });
    };
    return animate(material, m);
  }

  function show(map) {
    animated.length = 0;
    if (current) {
      scene.remove(current);
      current.traverse((o) => {
        if (!o.isMesh) return;
        o.geometry.dispose();
        o.material.forEach((m) => m.dispose());  // pooled textures outlive the mesh
      });
    }
    const position = new THREE.BufferAttribute(b64(map.position, Int16Array), 3, true);
    const normal = new THREE.BufferAttribute(b64(map.normal, Int8Array), 3, true);
    const IndexArray = map.wideIndex ? Uint32Array : Uint16Array;

    const g = new THREE.BufferGeometry();
    g.setAttribute("position", position);
    g.setAttribute("normal", normal);
    g.setAttribute("uv", new THREE.BufferAttribute(b64(map.uv, Uint16Array), 2));
    g.setAttribute("uvLayer2", new THREE.BufferAttribute(b64(map.uv2, Uint16Array), 2));
    g.setAttribute("blend", new THREE.BufferAttribute(b64(map.blend, Uint8Array), 1, true));
    g.setIndex(new THREE.BufferAttribute(b64(map.index, IndexArray), 1));
    map.groups.forEach((gr) => g.addGroup(gr.start, gr.count, gr.material));

    terrainShaders.length = 0;
    current = new THREE.Group();
    current.add(new THREE.Mesh(g, map.materials.map(groundMaterial)));
    // Dequantise on the object, never on the geometry.
    current.scale.set(map.scale[0], map.scale[1], map.scale[2]);
    current.position.set(map.offset[0], map.offset[1], map.offset[2]);
    scene.add(current);

    cam.target.set(0, (map.height[0] + map.height[1]) / 2, 0);
    cam.dist = Math.max(map.extent[0], map.extent[1]) * 1.3;
    place();

    const num = (v) => v.toLocaleString();
    document.getElementById("nf").textContent = num(map.faceCount);
    document.getElementById("ext").innerHTML =
      num(Math.round(map.extent[0])) + " &times; " + num(Math.round(map.extent[1])) +
      ' <span class="unit">u</span>';
    document.getElementById("hgt").innerHTML =
      map.height[0] + " to " + map.height[1] + ' <span class="unit">u</span>';
    document.getElementById("wat").innerHTML = map.water
      ? 'z=' + map.water.z + ' <span class="unit">u, ' + map.water.faces + ' faces</span>'
      : '<span class="unit">none</span>';
    document.getElementById("layers").innerHTML = map.layer1
      .map((n, i) => '<span class="layer' + (map.wetLayers.includes(i) ? " wet" : "") + '">' +
        n + "</span>").join("");
  }

  // --- mission object markers ---------------------------------------------
  // Each kind gets a silhouette you can tell apart at a distance: an upright
  // block for a building, a nose-up cone for a unit, a small ball for scenery.
  const SHAPES = {
    0: new THREE.BoxGeometry(15, 15, 15),
    1: new THREE.ConeGeometry(7, 20, 5),
    2: new THREE.SphereGeometry(5, 6, 5),
    3: new THREE.SphereGeometry(5, 6, 5),
  };
  const NEUTRAL = 0x8a8a85;
  const SCENERY = 0x6f7360;
  const modelCache = {};
  const modelMatCache = {};
  let overlay = null;

  // Objects are drawn from their real geometry, decoded through objects.rlb.
  // Geometries are shared between every placement of a model, and shading is
  // flat, so the meshes ship without per-vertex normals.
  // Levels of detail, and where each takes over.  A model carries up to four,
  // and they are the same object with detail removed rather than four
  // different objects -- posed, each sits on level 0's centre to within a
  // median 0.000 to 0.011 of the model's size.  The thresholds are in units of
  // the model's own radius, so a lamp post and a factory swap at the same
  // apparent size rather than the same distance.
  const LOD_AT = [0, 40, 100, 250];
  let lodOn = true;

  // 157 of the 435 object meshes carry an animation, and it is **rigid per
  // node**: one node poses a vertex and no vertex is shared between two, so a
  // model rides one bone per node at a single weight, with nothing to blend.
  // A key's frame is the key's own time field, so the keys are slerped by the
  // clock -- a turret's nine frames are six keys with holds between them, and
  // stepping them would jump 90 degrees at a time.
  const POSE_FPS = 15;
  let animOn = true;
  const skeletons = {};

  function skeletonFor(i) {
    if (skeletons[i] !== undefined) return skeletons[i];
    const src = DATA.models[i];
    if (!src || !src.bones) return (skeletons[i] = null);
    const bones = src.bones.map((b) => {
      const bone = new THREE.Bone();
      bone.position.set(b.r[0], b.r[1], b.r[2]);
      bone.quaternion.set(b.r[4], b.r[5], b.r[6], b.r[3]);
      return bone;
    });
    // The bones hold model-space poses, but the geometry is quantised into a
    // cube and the mesh's own transform scales it back out; the skin runs
    // before that, in the geometry's own space.  Undoing the transform on the
    // bone root puts the two in the same space -- and it is why an animated
    // model is quantised uniformly, since a rotation does not survive a
    // non-uniform scale.
    const root = new THREE.Group();
    const h = src.scale[0];
    root.scale.setScalar(1 / h);
    root.position.set(-src.offset[0] / h, -src.offset[1] / h, -src.offset[2] / h);
    src.bones.forEach((b, k) => (b.p >= 0 ? bones[b.p] : root).add(bones[k]));
    root.updateMatrixWorld(true);
    // Skeleton() takes the bones' inverses from where they stand, so this has
    // to happen with every bone at its rest pose.
    skeletons[i] = {
      skeleton: new THREE.Skeleton(bones),
      root, bones,
      tracks: src.bones.map((b) => (b.k ? b64(b.k, Float32Array) : null)),
      cursor: src.bones.map(() => 0),
      frames: src.frames,
    };
    return skeletons[i];
  }

  const _qa = new THREE.Quaternion(), _qb = new THREE.Quaternion();

  function poseSkeletons(clock) {
    Object.keys(skeletons).forEach((key) => {
      const rec = skeletons[key];
      if (!rec) return;
      const f = animOn ? (clock * POSE_FPS) % rec.frames : 0;
      rec.tracks.forEach((track, k) => {
        if (!track) return;
        const n = track.length / 8;
        let i = rec.cursor[k];
        if (i >= n || track[i * 8] > f) i = 0;
        while (i + 1 < n && track[(i + 1) * 8] <= f) i++;
        rec.cursor[k] = i;
        const j = (i + 1) % n;
        const t0 = track[i * 8];
        // The last key runs to the end of the loop, not to the first key's
        // own frame, or the wrap would play backwards.
        const t1 = j === 0 ? rec.frames : track[j * 8];
        const u = t1 > t0 ? Math.min(1, Math.max(0, (f - t0) / (t1 - t0))) : 0;
        const a = i * 8, b = j * 8;
        const bone = rec.bones[k];
        bone.position.set(
          track[a + 1] + (track[b + 1] - track[a + 1]) * u,
          track[a + 2] + (track[b + 2] - track[a + 2]) * u,
          track[a + 3] + (track[b + 3] - track[a + 3]) * u);
        _qa.set(track[a + 5], track[a + 6], track[a + 7], track[a + 4]);
        _qb.set(track[b + 5], track[b + 6], track[b + 7], track[b + 4]);
        bone.quaternion.copy(_qa).slerp(_qb, u);
      });
      rec.root.updateMatrixWorld(true);
    });
  }

  function modelGeometry(i, lod) {
    const key = i + "@" + lod;
    if (modelCache[key]) return modelCache[key];
    const src = DATA.models[i];
    const g = new THREE.BufferGeometry();
    // Positions arrive quantised to int16 over the model's bounding box; the
    // normalized flag maps them back to -1..1 in the shader. The scale and
    // offset that restore world units are applied to the *object*, never to
    // the geometry: BufferGeometry.scale() reads raw integers out of a
    // normalized attribute and writes them back, which overflows the buffer.
    g.setAttribute("position",
      new THREE.BufferAttribute(b64(src.position, Int16Array), 3, true));
    g.setAttribute("uv", new THREE.BufferAttribute(b64(src.uv, Uint16Array), 2));
    // Baked lighting has its own UV set; three.js reads a lightMap through uv2.
    if (src.uv2) g.setAttribute("uv2", new THREE.BufferAttribute(b64(src.uv2, Uint16Array), 2));
    g.setIndex(new THREE.BufferAttribute(
      b64(src.index, src.wide ? Uint32Array : Uint16Array), 1));
    if (src.skin) {
      // One bone per vertex at full weight: the animation is rigid per node,
      // so the other three slots stay empty.
      const node = b64(src.skin, Uint16Array);
      const index = new Uint16Array(node.length * 4);
      const weight = new Float32Array(node.length * 4);
      for (let v = 0; v < node.length; v++) {
        index[v * 4] = node[v];
        weight[v * 4] = 1;
      }
      g.setAttribute("skinIndex", new THREE.BufferAttribute(index, 4));
      g.setAttribute("skinWeight", new THREE.BufferAttribute(weight, 4));
    }
    // Every level shares one position, uv and index buffer; a level's
    // geometry is just the subset of groups tagged with it.
    groupsFor(src, lod).forEach((gr, k) => g.addGroup(gr.start, gr.count, k));
    g.computeVertexNormals();
    modelCache[key] = g;
    return g;
  }

  //: The groups of one level.  A model packed before levels existed has none
  //: tagged, in which case every group belongs to level 0.
  function groupsFor(src, lod) {
    return src.groups.filter((gr) => (gr.lod || 0) === lod);
  }

  //: Which levels a model actually carries, coarsest last.
  function lodsOf(src) {
    const seen = new Set(src.groups.map((gr) => gr.lod || 0));
    return [...seen].sort((a, b) => a - b);
  }

  // One material per draw batch, textured through
  // batch -> wear -> Material.lib -> Textures.lib.
  function modelMaterials(i, tint, lod) {
    const key = i + "|" + tint + "@" + lod;
    if (modelMatCache[key]) return modelMatCache[key];
    const src = DATA.models[i];
    const mats = groupsFor(src, lod).map((gr) => {
      const opts = { side: THREE.FrontSide, color: tint, skinning: !!src.skin };
      const pooled = gr.material >= 0 ? DATA.pool[gr.material] : null;
      if (pooled && pooled.kind === "texture") {
        opts.map = groundTexture(gr.material);
        opts.color = multiply(tint, gr.tint);
      } else if (pooled) {
        opts.color = multiply(tint, multiply(gr.tint, pooled.colour));
      }
      // How the material draws is in Material.lib's archive directory, not
      // in the record: 4 is see-through, 8 additive.  A blended material
      // keeps its alpha channel through the pool, so it blends rather than
      // cutting a silhouette out of itself -- and it must not take the alpha
      // *test* a cutout does, which is why applyCutout only runs for the
      // rest.  140 model materials draw see-through (the bunker portals,
      // B_COMP_3G instrument glass) and ten additive (PI_LIGHT, PI_TELE, the
      // bridge glows).
      // The two signals say different things and both are used: the flags
      // say how the material *composites*, the texture says what its alpha
      // *means*.  A silhouette wants the alpha test -- 32 of the see-through
      // materials are foliage, FTREE1, HTREE1, GRASS, ELKA -- while a graded
      // alpha wants blending.  Additive overrides both: an explosion or a
      // shield is a glow whatever shape its alpha has.
      if (gr.blend & BLEND_ADD) {
        opts.transparent = true;
        opts.blending = THREE.AdditiveBlending;
        opts.depthWrite = false;
      } else if ((gr.blend & BLEND_ALPHA) && pooled && !pooled.cutout) {
        opts.transparent = true;
        // A see-through part is small and sits inside its own model, so
        // leaving depth unwritten is what keeps it from culling the rest.
        opts.depthWrite = false;
      } else if (pooled) {
        applyCutout(opts, pooled);
      }
      if (gr.lightmap !== undefined) {
        // Baked static lighting: 21 buildings ship one, keyed by their wear's
        // LIGHTMAPS section.  It has its own UV set, and no wrapping -- the
        // atlas is inset by half a texel and must not tile.
        const t = textureCache["lm" + gr.lightmap] ||
          (textureCache["lm" + gr.lightmap] = loader.load(DATA.pool[gr.lightmap].url));
        t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
        t.repeat.set(1 / LIGHTMAP_UV_SCALE, 1 / LIGHTMAP_UV_SCALE);
        opts.lightMap = t;
        opts.lightMapIntensity = LIGHTMAP_INTENSITY;
      }
      return animate(new THREE.MeshLambertMaterial(opts), gr);
    });
    modelMatCache[key] = mats;
    return mats;
  }

  // A model sits inside a group so its own scale and offset compose with the
  // placement's rotation in the right order.
  function modelInstance(i, tint) {
    const src = DATA.models[i];
    const levels = lodsOf(src);
    // The radius the thresholds are measured in: the model's own half-extent.
    const radius = Math.max(src.scale[0], src.scale[1], src.scale[2]);
    const group = new THREE.Group();
    const lod = new THREE.LOD();
    const rig = skeletonFor(i);
    levels.forEach((level, rank) => {
      const geometry = modelGeometry(i, level);
      const mats = modelMaterials(i, tint, level);
      let inner;
      if (rig) {
        inner = new THREE.SkinnedMesh(geometry, mats);
        // Detached: the skin runs in the geometry's own space and the mesh's
        // transform places the instance afterwards, so every placement of a
        // model can share one skeleton and they animate in step.
        inner.bindMode = "detached";
        inner.bind(rig.skeleton, new THREE.Matrix4());
      } else {
        inner = new THREE.Mesh(geometry, mats);
      }
      inner.scale.set(src.scale[0], src.scale[1], src.scale[2]);
      inner.position.set(src.offset[0], src.offset[1], src.offset[2]);
      // Rank, not the level number: a model missing level 1 should still hand
      // over to whatever it does carry at the first threshold.
      lod.addLevel(inner, rank === 0 ? 0 : LOD_AT[Math.min(rank, 3)] * radius);
    });
    lod.autoUpdate = lodOn;
    lodGroups.push(lod);
    group.add(lod);
    return group;
  }

  //: Every LOD in the scene, so the toggle can pin them all to level 0.
  let lodGroups = [];

  function applyLod() {
    lodGroups.forEach((lod) => {
      lod.autoUpdate = lodOn;
      if (!lodOn) {
        lod.levels.forEach((l, k) => { l.object.visible = k === 0; });
      }
    });
  }

  function clearOverlay() {
    if (!overlay) return;
    scene.remove(overlay);
    overlay.traverse((n) => {
      // Marker shapes and model geometries are shared and outlive the overlay;
      // only line geometry is built per mission.
      if (n.isLine && n.geometry.dispose) n.geometry.dispose();
      if ((n.isMesh || n.isLine) && n.material.dispose) n.material.dispose();
    });
    overlay = null;
    footprints = [];
    lodGroups = [];
    Object.keys(skeletons).forEach((k) => delete skeletons[k]);
  }

  function showMission(mis) {
    clearOverlay();
    const map = DATA.maps[mis.map];
    const cx = map.centre[0], cy = map.centre[1];
    overlay = new THREE.Group();

    const flat = (colour) => new THREE.MeshLambertMaterial({
      color: colour, side: THREE.DoubleSide, flatShading: true,
    });
    const mats = mis.clans.map((c) => new THREE.MeshLambertMaterial({ color: c.colour }));
    const meshMats = mis.clans.map((c) => flat(c.colour));
    const neutral = new THREE.MeshLambertMaterial({ color: NEUTRAL });

    const sceneryMat = flat(SCENERY);
    let drawn = 0;
    const tintOf = (c) => {
      const r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
      const mix = (v) => Math.round(255 - (255 - v) * 0.35);
      return (mix(r) << 16) | (mix(g) << 8) | mix(b);
    };
    mis.objects.forEach((o) => {
      // o.p is [x, z, y] in game space; the map is recentred and Y-up.
      let m;
      if (o.m !== undefined) {
        // Clan-owned things take their clan's colour; scenery stays neutral.
        // Owned objects take a light wash of their clan colour over the
        // texture; scenery stays untinted.
        m = modelInstance(o.m, o.c < 0 ? 0xffffff : tintOf(mis.clans[o.c].colour));
        m.position.set(o.p[0] - cx, o.p[1], -(o.p[2] - cy));
        // A building's .bas ground plan, drawn through the same placement so
        // that it checks the placement rather than agreeing with it.  See
        // docs/07-objects.md.
        const plan = DATA.models[o.m] && DATA.models[o.m].plan;
        if (plan) {
          const ring = new THREE.LineLoop(
            new THREE.BufferGeometry().setFromPoints(
              plan.map((q) => new THREE.Vector3(q[0], q[1], q[2]))
            ),
            new THREE.LineBasicMaterial({ color: 0x40e0a0, depthTest: false })
          );
          ring.visible = false;
          ring.renderOrder = LAYER.footprint;
          m.add(ring);
          footprints.push(ring);
        }
        // Game rotation is about its up axis, which is the viewer's Y.  The
        // axis swap (x, y, z) -> (x, z, -y) carries the sense across
        // unchanged, so the angle is used as it stands.  The bridges are the
        // proof: each is two halves placed back to back, their rotations
        // exactly pi apart, and this joins their ends to 0.00 units on all
        // eight pairs -- against 4.9 to 282.8 units apart if the angle is
        // negated.  See docs/04-missions.md.
        m.rotation.y = o.r;
        drawn++;
      } else {
        m = new THREE.Mesh(SHAPES[o.k] || SHAPES[2], o.c < 0 ? neutral : mats[o.c]);
        m.position.set(o.p[0] - cx, o.p[1] + 8, -(o.p[2] - cy));
      }
      overlay.add(m);
    });

    // Campaign missions carry waypoint routes; draw them as polylines.
    mis.routes.forEach((route) => {
      const pts = route.map((p) => new THREE.Vector3(p[0] - cx, p[2] + 6, -(p[1] - cy)));
      const g = new THREE.BufferGeometry().setFromPoints(pts);
      overlay.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xd0a050 })));
    });

    scene.add(overlay);

    document.getElementById("objdt").hidden = false;
    document.getElementById("obj").hidden = false;
    document.getElementById("obj").innerHTML = mis.objects.length.toLocaleString() +
      (drawn ? ' <span class="unit">(' + drawn + " meshed)</span>" : "");
    document.getElementById("timebox").hidden = !(mis.sky && mis.sky.day && mis.sky.day.length > 1);
    const skyRow = document.getElementById("sky"), skyLabel = document.getElementById("skydt");
    skyRow.hidden = skyLabel.hidden = !mis.sky;
    if (mis.sky) {
      // The weather a mission's keyframes name.  Not drawn -- see the note by
      // the sky layers -- but worth saying which missions have it.
      const weather = (mis.sky.weather || []).join(" + ");
      skyRow.innerHTML = mis.sky.time + ' <span class="unit">' + mis.sky.keyframes +
        " keyframes" + (weather ? " &middot; " + weather : "") + "</span>";
    }
    document.getElementById("clanbox").hidden = false;
    document.getElementById("clans").innerHTML = mis.clans.map((c) =>
      '<span class="layer clan"><span class="dot" style="background:#' +
      c.colour.toString(16).padStart(6, "0") + '"></span>' + c.name + "</span>").join("");
  }

  function showTerrainOnly() {
    clearOverlay();
    document.getElementById("objdt").hidden = true;
    document.getElementById("obj").hidden = true;
    document.getElementById("skydt").hidden = true;
    document.getElementById("sky").hidden = true;
    document.getElementById("timebox").hidden = true;
    document.getElementById("clanbox").hidden = true;
  }

  // --- scene selector -----------------------------------------------------
  const sel = document.getElementById("scenesel");
  const scenes = [];
  function addGroup(name, entries) {
    if (!entries.length) return;
    const g = document.createElement("optgroup");
    g.label = name;
    entries.forEach(({ text, fn }) => {
      const o = document.createElement("option");
      o.value = String(scenes.length);
      o.textContent = text;
      scenes.push(fn);
      g.appendChild(o);
    });
    sel.appendChild(g);
  }
  addGroup("Missions", DATA.missions.map((mis) => ({
    text: mis.label + " -- " + mis.title,
    fn: () => {
      missionSky = mis.sky || null;
      applyTheme();
      show(DATA.maps[mis.map]);
      showMission(mis);
      document.getElementById("path").textContent =
        "MISSIONS/" + mis.label.replace(" / ", "/") + "/data.tma";
    },
  })));
  addGroup("Terrain only", DATA.maps.map((m, i) => ({
    text: m.name,
    fn: () => {
      missionSky = null;
      applyTheme();
      show(DATA.maps[i]);
      showTerrainOnly();
      document.getElementById("path").textContent = "DATA/MAPS/" + m.name + "/Land.msh";
    },
  })));
  sel.addEventListener("change", () => scenes[+sel.value]());

  document.getElementById("wire").addEventListener("click", (e) => {
    const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", String(on));
    current.traverse((o) => {
      if (o.isMesh) o.material.forEach((m) => { m.wireframe = on; });
    });
  });
  document.getElementById("anim").addEventListener("click", (e) => {
    animOn = !animOn;
    e.currentTarget.setAttribute("aria-pressed", String(animOn));
  });

  document.getElementById("lod").addEventListener("click", (e) => {
    lodOn = !lodOn;
    e.currentTarget.setAttribute("aria-pressed", String(lodOn));
    applyLod();
  });

  document.getElementById("plan").addEventListener("click", (e) => {
    const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", String(on));
    footprints.forEach((o) => { o.visible = on; });
  });
  document.getElementById("blend").addEventListener("click", (e) => {
    layer2On = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", String(layer2On));
    terrainShaders.forEach((s) => { s.uniforms.layer2Mix.value = layer2On ? 1 : 0; });
  });
  document.getElementById("time").addEventListener("input", (e) => {
    const day = (missionSky && missionSky.day) || [];
    applyKeyframe(day[+e.currentTarget.value]);
  });
  document.getElementById("spin").addEventListener("click", (e) => {
    spinning = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", String(spinning));
  });
  if (reduceMotion) document.getElementById("spin").setAttribute("aria-pressed", "false");

  function resize() {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    flareCamera.right = innerWidth;
    flareCamera.top = innerHeight;
    flareCamera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  resize();
  scenes[0]();

  let lastFrame = performance.now();
  (function loop() {
    requestAnimationFrame(loop);
    const now = performance.now();
    const dt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;
    if (spinning) { cam.yaw += 0.0015; place(); }
    skyGroup.position.copy(camera.position);
    fallRain(dt);
    if (animated.length) {
      const tick = Math.floor(performance.now() * ANIM_FPS / 1000);
      animated.forEach((a) => { a.apply(a.frames[tick % a.frames.length]); });
    }
    poseSkeletons(now / 1000);
    renderer.render(scene, camera);
    if (sunHeading && drawFlare(sunHeading, flareGate)) {
      renderer.autoClear = false;
      renderer.render(flareScene, flareCamera);
      renderer.autoClear = true;
    }
  })();
}
</script>

<title>__TITLE__</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #fffefb; --ink: #1c1b18; --muted: #6b675f;
    --line: #ddd8cf; --accent: #8a5a2b; --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171614; --panel: #211f1c; --ink: #ece8e1; --muted: #9a948a;
      --line: #35322d; --accent: #d29b62; --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #171614; --panel: #211f1c; --ink: #ece8e1; --muted: #9a948a;
    --line: #35322d; --accent: #d29b62; --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }
  .panel {
    position: fixed; top: 14px; left: 14px; z-index: 5; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    padding: 12px 14px; max-width: 290px;
  }
  h1 { margin: 0 0 2px; font-size: 15px; font-weight: 620; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 4px; }
  select, button {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; width: 100%;
  }
  button { cursor: pointer; margin-top: 6px; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 10px 0 0; font-size: 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .hint { margin-top: 11px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .sw { font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
  #err { position: fixed; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; color: var(--muted); }
</style>

<div id="stage"></div>
<div class="panel">
  <h1>Parkan terrain</h1>
  <div class="sub">Geometry decoded from <code>Land.msh</code></div>
  <label for="mapsel">Map</label>
  <select id="mapsel"></select>
  <button id="wire" aria-pressed="false">Wireframe</button>
  <button id="spin" aria-pressed="true">Auto-rotate</button>
  <dl>
    <dt>Vertices</dt><dd id="nv">-</dd>
    <dt>Triangles</dt><dd id="nf">-</dd>
    <dt>Extent</dt><dd id="ext">-</dd>
    <dt>Height</dt><dd id="hgt">-</dd>
  </dl>
  <div class="swatches" id="sw"></div>
  <div class="hint">Drag to orbit &middot; scroll to zoom &middot; shift-drag to pan</div>
</div>
<div id="err" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = "__DATA__";
const UV_SCALE = 256;

function b64(s, Type) {
  const bin = atob(s);
  const buf = new ArrayBuffer(bin.length);
  const view = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
  return new Type(buf);
}

if (typeof THREE === "undefined") {
  const e = document.getElementById("err");
  e.hidden = false;
  e.textContent = "three.js failed to load, so the terrain cannot be drawn.";
} else {
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(48, 1, 1, 40000);
  const sun = new THREE.DirectionalLight(0xffffff, 0.95);
  sun.position.set(-0.5, 1.0, 0.6);
  scene.add(sun, new THREE.AmbientLight(0xffffff, 0.42));

  const themeBg = () => {
    const dark = document.documentElement.dataset.theme === "dark" ||
      (document.documentElement.dataset.theme !== "light" &&
       matchMedia("(prefers-color-scheme: dark)").matches);
    return dark ? 0x171614 : 0xdfdcd5;
  };
  const applyBg = () => {
    scene.background = new THREE.Color(themeBg());
    scene.fog = new THREE.Fog(themeBg(), 3000, 9000);
  };
  applyBg();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyBg);

  // --- orbit camera (hand-rolled: keeps the page to a single CDN script) ---
  const cam = { yaw: -0.7, pitch: 0.62, dist: 3200, target: new THREE.Vector3(0, 0, 0) };
  let spinning = true;
  function place() {
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    camera.position.set(
      cam.target.x + cam.dist * cp * Math.sin(cam.yaw),
      cam.target.y + cam.dist * sp,
      cam.target.z + cam.dist * cp * Math.cos(cam.yaw)
    );
    camera.lookAt(cam.target);
  }
  let drag = null;
  renderer.domElement.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 2 };
    renderer.domElement.setPointerCapture(e.pointerId);
    spinning = false; document.getElementById("spin").setAttribute("aria-pressed", "false");
  });
  renderer.domElement.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.pan) {
      const k = cam.dist * 0.0012;
      cam.target.x -= (dx * Math.cos(cam.yaw) - dy * Math.sin(cam.yaw)) * k;
      cam.target.z += (dx * Math.sin(cam.yaw) + dy * Math.cos(cam.yaw)) * k;
    } else {
      cam.yaw -= dx * 0.005;
      cam.pitch = Math.max(0.04, Math.min(1.5, cam.pitch + dy * 0.005));
    }
    place();
  });
  const endDrag = () => { drag = null; };
  renderer.domElement.addEventListener("pointerup", endDrag);
  renderer.domElement.addEventListener("pointercancel", endDrag);
  renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());
  renderer.domElement.addEventListener("wheel", (e) => {
    e.preventDefault();
    cam.dist = Math.max(150, Math.min(14000, cam.dist * (1 + Math.sign(e.deltaY) * 0.12)));
    place();
  }, { passive: false });

  // --- build one map ---
  const loader = new THREE.TextureLoader();
  const textureCache = {};
  let current = null;
  function show(map) {
    if (current) {
      scene.remove(current);
      current.geometry.dispose();
      current.material.forEach((m) => m.dispose());  // pooled textures outlive the mesh
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(b64(map.position, Float32Array), 3));
    g.setAttribute("normal", new THREE.BufferAttribute(b64(map.normal, Int16Array), 3, true));
    g.setAttribute("uv", new THREE.BufferAttribute(b64(map.uv, Uint16Array), 2));
    g.setIndex(new THREE.BufferAttribute(
      b64(map.index, map.wideIndex ? Uint32Array : Uint16Array), 1));
    map.groups.forEach((gr) => g.addGroup(gr.start, gr.count, gr.material));

    const mats = map.materials.map((m) => {
      const src = DATA.pool[m.pool];
      const opts = { side: THREE.DoubleSide };
      if (src.kind === "texture") {
        const t = textureCache[m.pool] || (textureCache[m.pool] = loader.load(src.url));
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        // UVs arrive as raw 8.8 fixed point; undo the scale here.
        t.repeat.set(1 / UV_SCALE, 1 / UV_SCALE);
        opts.map = t;
      } else {
        opts.color = src.colour;
      }
      if (m.water || src.opacity < 1) { opts.transparent = true; opts.opacity = src.opacity; }
      return new THREE.MeshLambertMaterial(opts);
    });
    current = new THREE.Mesh(g, mats);
    scene.add(current);

    cam.target.set(0, (map.height[0] + map.height[1]) / 2, 0);
    cam.dist = Math.max(map.extent[0], map.extent[1]) * 1.35;
    place();

    document.getElementById("nv").textContent = map.vertexCount.toLocaleString();
    document.getElementById("nf").textContent = map.faceCount.toLocaleString();
    document.getElementById("ext").textContent = map.extent[0] + " x " + map.extent[1];
    document.getElementById("hgt").textContent = map.height[0] + " to " + map.height[1];
    document.getElementById("sw").innerHTML = map.layer1
      .map((n) => '<span class="sw">' + n + "</span>").join("");
  }

  const sel = document.getElementById("mapsel");
  DATA.maps.forEach((m, i) => {
    const o = document.createElement("option");
    o.value = String(i); o.textContent = m.name;
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => show(DATA.maps[+sel.value]));

  document.getElementById("wire").addEventListener("click", (e) => {
    const on = e.target.getAttribute("aria-pressed") !== "true";
    e.target.setAttribute("aria-pressed", String(on));
    current.material.forEach((m) => { m.wireframe = on; });
  });
  document.getElementById("spin").addEventListener("click", (e) => {
    spinning = e.target.getAttribute("aria-pressed") !== "true";
    e.target.setAttribute("aria-pressed", String(spinning));
  });

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  resize();
  show(DATA.maps[0]);

  (function loop() {
    requestAnimationFrame(loop);
    if (spinning) { cam.yaw += 0.0016; place(); }
    renderer.render(scene, camera);
  })();
}
</script>

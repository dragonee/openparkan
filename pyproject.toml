[project]
name = "openparkan"
version = "0.1.0"
description = "A reimplementation of Parkan: Iron Strategy game engine"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["parkan", "reverse-engineering", "game-formats", "nres"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Disassemblers",
]
# Deliberately empty: the toolkit runs on a bare interpreter so that anyone
# can point it at a Steam install without a build step.
dependencies = []

[project.scripts]
openparkan = "openparkan.cli:main"

[project.urls]
Documentation = "https://github.com/dragonee/openparkan/tree/main/docs"

[dependency-groups]
analysis = [
    "capstone>=5.0.9",
    "pefile>=2024.8.26",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openparkan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

